<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment Live</title>
<style>
  :root {
    --ink: #0f1419;
    --panel: #161c24;
    --line: #232c38;
    --text: #e6edf3;
    --muted: #7d8a99;
    --signal: #3fb98a;
    --signal-dim: rgba(63, 185, 138, 0.12);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(63,185,138,0.06), transparent 60%);
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6);
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .bar .name {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .body { padding: 40px 32px 36px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 6px 13px;
    border-radius: 100px;
    background: var(--signal-dim);
    color: var(--signal);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 0 rgba(63,185,138,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63,185,138,0.5); }
    70% { box-shadow: 0 0 0 9px rgba(63,185,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,185,138,0); }
  }

  h1 {
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .lede {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .meta {
    border-top: 1px solid var(--line);
    padding-top: 22px;
    display: grid;
    gap: 14px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .row .k {
    font-size: 13px;
    color: var(--muted);
  }
  .row .v {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    text-align: right;
  }

  footer {
    margin-top: 28px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.03em;
  }

  @media (max-width: 420px) {
    .body { padding: 32px 22px 28px; }
    h1 { font-size: 25px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="bar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span class="name">test-page</span>
    </div>
    <div class="body">
      <div class="status">
        <span class="pulse"></span>
        Deployment live
      </div>
      <h1>Production file!</h1>
      <p class="lede">
        This page is being served from your environment. If you can read this,
        the build shipped and the pipeline reached its deploy stage cleanly.
      </p>
      <div class="meta">
        <div class="row">
          <span class="k">Served at</span>
          <span class="v" id="time">—</span>
        </div>
        <div class="row">
          <span class="k">Host</span>
          <span class="v" id="host">—</span>
        </div>
        <div class="row">
          <span class="k">Path</span>
          <span class="v" id="path">—</span>
        </div>
        <div class="row">
          <span class="k">Viewport</span>
          <span class="v" id="vp">—</span>
        </div>
      </div>
      <footer id="footer">READY</footer>
    </div>
  </main>

  <script>
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    document.getElementById('time').textContent =
      now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
      ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.getElementById('host').textContent = location.hostname || 'localhost';
    document.getElementById('path').textContent = location.pathname || '/';
    const setVp = () => document.getElementById('vp').textContent =
      window.innerWidth + ' × ' + window.innerHeight;
    setVp();
    window.addEventListener('resize', setVp);
  </script>
</body>
</html>
